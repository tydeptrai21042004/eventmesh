name: EventMesh — One CI and Funded Testnet Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Runs roughly every 6 hours to detect faucet funding and follow up on pending TX.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      broadcast_synthetic_anchor:
        description: 'Opt in to ONE synthetic CKB Testnet checkpoint (NOT a real Fiber payment)'
        required: true
        type: boolean
        default: false
      live_fiber_mode:
        description: 'Separate real FNN + CKB job. Requires configured persistent self-hosted runner.'
        required: true
        type: choice
        default: 'off'
        options: ['off', 'preflight', 'payment-and-anchor', 'reconcile']
      live_approval:
        description: 'For payment-and-anchor ONLY: type RUN_ONE_TESTNET_PAYMENT_AND_ANCHOR'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: eventmesh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Compile, unit, fault matrix, evidence and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - name: Install
        id: install
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-fund --no-audit
            echo 'REPRODUCIBLE_INSTALL=true' >> "$GITHUB_ENV"
          else
            echo 'WARNING: generate and commit package-lock.json for reproducible CI.'
            npm install --no-fund --no-audit
            echo 'REPRODUCIBLE_INSTALL=false' >> "$GITHUB_ENV"
          fi
      - name: Full code checks and fault tests
        id: checks
        shell: bash
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          npm run check:all 2>&1 | tee artifacts/ci/check.log
      - name: Detailed fault regression tests (run even when core check fails)
        id: faults
        if: always() && steps.install.outcome == 'success'
        shell: bash
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          npm run test:faults 2>&1 | tee artifacts/ci/faults.log
      - name: Baseline comparison and reviewer failure matrix
        id: comparison
        if: always() && steps.install.outcome == 'success'
        shell: bash
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          npm run compare:alternatives 2>&1 | tee artifacts/ci/alternatives.log
          npm run compare:failures 2>&1 | tee artifacts/ci/failure-matrix.log
      - name: Audit production dependencies (report separately from tests)
        continue-on-error: true
        id: audit
        shell: bash
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high 2>&1 | tee artifacts/ci/dependency-audit.log
      - name: Build fingerprint and execution evidence
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CHECK_OUTCOME: ${{ steps.checks.outcome }}
          FAULT_OUTCOME: ${{ steps.faults.outcome }}
          COMPARE_OUTCOME: ${{ steps.comparison.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: node scripts/ci-evidence.mjs
      - name: Upload all CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventmesh-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 30
      # If the archive omitted package-lock.json, npm install created a candidate.
      # Artifact is only a proposal; maintainers must review + commit it for npm ci.
      - name: Upload generated dependency lockfile candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventmesh-lockfile-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: package-lock.json
          if-no-files-found: ignore
          retention-days: 30

  security:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CodeQL is kept in the SAME workflow, not a separate workflow file.
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  funded-testnet:
    name: Legacy synthetic CKB checkpoint + RPC diagnostics (NO FIBER)
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore remembered transaction identity
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .github-testnet-state/
          key: eventmesh-testnet-v1-${{ hashFiles('config/testnet-wallet.json', 'scripts/auto-testnet.mjs') }}
      - name: Install runtime dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci --no-fund --no-audit; else npm install --no-fund --no-audit; fi
          npm run build:runtime
      # Probe automatically; broadcast synthetic test data ONLY after manual opt-in.
      - name: Check wallet and optionally submit one explicitly approved synthetic checkpoint
        id: testnet
        env:
          CKB_RPC_URL: ${{ vars.CKB_RPC_URL || 'https://testnet.ckbapp.dev/' }}
          CKB_TESTNET_PRIVATE_KEY: ${{ secrets.CKB_TESTNET_PRIVATE_KEY }}
          EVENTMESH_SYNTHETIC_BROADCAST_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.broadcast_synthetic_anchor || false }}
        shell: bash
        run: |
          if [[ "$EVENTMESH_SYNTHETIC_BROADCAST_APPROVED" == "true" ]]; then
            node scripts/auto-testnet.mjs run
          else
            node scripts/auto-testnet.mjs probe
          fi
      - name: Save transaction identity after any attempted broadcast
        if: always() && steps.restore.outputs.cache-hit != 'true' && steps.testnet.outputs.state_written == 'true'
        uses: actions/cache/save@v4
        with:
          path: .github-testnet-state/
          key: eventmesh-testnet-v1-${{ hashFiles('config/testnet-wallet.json', 'scripts/auto-testnet.mjs') }}
      - name: Check evidence scope (do not confuse synthetic CKB with Fiber)
        if: always() && steps.testnet.outcome == 'success'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          const path = 'artifacts/testnet/report.json';
          if (!existsSync(path)) throw new Error('CKB_TESTNET_REPORT_MISSING');
          const report = JSON.parse(readFileSync(path, 'utf8'));
          if (!String(report.note || '').includes('synthetic CKB checkpoint')) throw new Error('EVIDENCE_SCOPE_MISSING');
          if (report.status === 'CONFIRMED') {
            if (report.inspection?.ok !== true || report.inspection?.dataMatches !== true ||
                Number(report.inspection?.confirmations) < 2 || !/^0x[0-9a-f]{64}$/i.test(report.txHash || '')) {
              throw new Error('UNSUPPORTED_CKB_CONFIRMATION_CLAIM');
            }
          }
          console.log('Recorded scope:', report.status, '— real CKB checkpoint only; Fiber not demonstrated');
          NODE
      - name: Read-only CKB RPC/network diagnostics (DNS, chain, indexer, balance)
        if: always()
        env:
          CKB_RPC_URL: ${{ vars.CKB_RPC_URL || 'https://testnet.ckbapp.dev/' }}
          CKB_TESTNET_PRIVATE_KEY: ${{ secrets.CKB_TESTNET_PRIVATE_KEY }}
        run: node scripts/ckb-ci-diagnostics.mjs
      - name: Upload Testnet evidence (including unfunded status)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventmesh-testnet-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/testnet/
          if-no-files-found: warn
          retention-days: 90

  real-fiber-testnet:
    name: MANUAL — real two-FNN payment + real CKB anchor
    needs: quality
    if: github.event_name == 'workflow_dispatch' && inputs.live_fiber_mode != 'off'
    # Run on a dedicated PERSISTENT self-hosted machine, not ephemeral GitHub-hosted CI.
    # Provision labels and its private 0700 journal directory before enabling this job.
    runs-on: [self-hosted, linux, x64, eventmesh-testnet]
    environment: fiber-testnet-live
    timeout-minutes: 45
    concurrency:
      group: eventmesh-single-real-testnet-payment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build checked runtime
        run: |
          if [ -f package-lock.json ]; then npm ci --no-fund --no-audit; else npm install --no-fund --no-audit; fi
          npm run build:runtime
      - name: Validate execution gate (no payment yet)
        shell: bash
        env:
          MODE: ${{ inputs.live_fiber_mode }}
          LIVE_APPROVAL: ${{ inputs.live_approval }}
          STATE_DIR: ${{ vars.EVENTMESH_DURABLE_STATE_DIR }}
        run: |
          set -euo pipefail
          echo "[EVENTMESH_GATE] selected_mode=$MODE"
          if [[ "$MODE" == 'payment-and-anchor' && "$LIVE_APPROVAL" != 'RUN_ONE_TESTNET_PAYMENT_AND_ANCHOR' ]]; then
            echo '::error title=Manual payment gate::Type the exact approval phrase in Run workflow.'
            exit 1
          fi
          if [[ "$MODE" != 'preflight' && -z "$STATE_DIR" ]]; then
            echo '::error title=Missing persistent journal::Configure variable EVENTMESH_DURABLE_STATE_DIR on your self-hosted runner environment.'
            exit 1
          fi
          echo '[EVENTMESH_GATE] No funds spent during gate validation.'
      - name: Real independent FNN preflight / paid proof / on-chain checkpoint
        id: live
        shell: bash
        env:
          OPERATOR_A_URL: ${{ vars.OPERATOR_A_URL }}
          OPERATOR_B_URL: ${{ vars.OPERATOR_B_URL }}
          OPERATOR_A_TOKEN: ${{ secrets.OPERATOR_A_TOKEN }}
          OPERATOR_B_TOKEN: ${{ secrets.OPERATOR_B_TOKEN }}
          EVENTMESH_DURABLE_STATE_DIR: ${{ vars.EVENTMESH_DURABLE_STATE_DIR }}
          EVENTMESH_LIVE_APPROVAL: ${{ inputs.live_approval }}
          EVENTMESH_TESTNET_NETWORK_CONFIRM: TESTNET_ONLY
          EVENTMESH_ALLOW_FIBER_PAYMENT: YES_ONE_TESTNET_PAYMENT
          EVENTMESH_PAYMENT_SHANNONS: ${{ vars.EVENTMESH_PAYMENT_SHANNONS || '100000000' }}
          EVENTMESH_MAX_PAYMENT_SHANNONS: ${{ vars.EVENTMESH_MAX_PAYMENT_SHANNONS || '100000000' }}
          EVENTMESH_CKB_RECONCILE_POLLS: ${{ vars.EVENTMESH_CKB_RECONCILE_POLLS || '6' }}
          EVENTMESH_VERBOSE_DIAGNOSTICS: 'true'
          SELECTED_MODE: ${{ inputs.live_fiber_mode }}
        run: |
          set -euo pipefail
          case "$SELECTED_MODE" in
            payment-and-anchor) MODE=run ;;
            preflight|reconcile) MODE="$SELECTED_MODE" ;;
            *) echo '::error::Unknown live mode'; exit 2 ;;
          esac
          node scripts/github-live-fiber.mjs "$MODE"
      - name: Upload real payment/CKB evidence and diagnostic status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventmesh-real-fiber-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/real-fiber-testnet/
          if-no-files-found: warn
          retention-days: 90
